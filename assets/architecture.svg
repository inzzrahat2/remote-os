<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title>Remote OS architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a90a2"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" rx="16" fill="#0e1015"/>
  <text x="450" y="38" text-anchor="middle" fill="#e8eaf0" font-size="20" font-weight="600">Remote OS on the Redmi 7 — boot partition</text>

  <!-- boot chain -->
  <g fill="#e8eaf0">
    <rect x="40" y="70" width="190" height="64" rx="12" fill="#232733"/>
    <text x="135" y="98" text-anchor="middle" font-weight="600">Bootloader (LK)</text>
    <text x="135" y="118" text-anchor="middle" fill="#8a90a2" font-size="12">appends skip_initramfs</text>
    <rect x="270" y="70" width="230" height="64" rx="12" fill="#232733"/>
    <text x="385" y="98" text-anchor="middle" font-weight="600">TWRP kernel 4.9 (patched)</text>
    <text x="385" y="118" text-anchor="middle" fill="#8a90a2" font-size="12">skip_initramfs → want_initramfs</text>
    <rect x="540" y="70" width="320" height="64" rx="12" fill="#232733"/>
    <text x="700" y="98" text-anchor="middle" font-weight="600">init (TWRP ramdisk, edited)</text>
    <text x="700" y="118" text-anchor="middle" fill="#8a90a2" font-size="12">on fs: mount /cache · on charger: late-init · adb</text>
  </g>
  <line x1="230" y1="102" x2="266" y2="102" stroke="#8a90a2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="102" x2="536" y2="102" stroke="#8a90a2" stroke-width="2" marker-end="url(#a)"/>

  <!-- services -->
  <g fill="#e8eaf0">
    <rect x="40" y="180" width="380" height="170" rx="14" fill="#1a1d25" stroke="#5b7cfa" stroke-width="2"/>
    <text x="230" y="208" text-anchor="middle" font-weight="600" fill="#5b7cfa">/sbin/recovery = remoteos (UI app)</text>
    <text x="60" y="236">• Home / TV / FAN / System pages, touchpad</text>
    <text x="60" y="258">• software renderer + page cache (614 MHz)</text>
    <text x="60" y="280">• NEC IR encoder → /dev/spidev6.1</text>
    <text x="60" y="302">• sleeper thread: wakeup_count → mem, RTC alarm</text>
    <text x="60" y="324">• battery estimate, /cache state + batlog</text>

    <rect x="450" y="180" width="410" height="170" rx="14" fill="#1a1d25" stroke="#46c37b" stroke-width="2"/>
    <text x="655" y="208" text-anchor="middle" font-weight="600" fill="#46c37b">btremote (BTstack HID device)</text>
    <text x="470" y="236">• WCNSS up via /dev/wcnss_wlan + NV calibration</text>
    <text x="470" y="258">• HCI over SMD: /dev/smd3 (cmd/evt), /dev/smd2 (ACL)</text>
    <text x="470" y="280">• keyboard + consumer reports, saved link key</text>
    <text x="470" y="302">• on / standby (5 min link hold) / off</text>
    <text x="470" y="324">• control FIFO /tmp/btctl, state /tmp/btstate</text>
  </g>
  <line x1="420" y1="265" x2="446" y2="265" stroke="#8a90a2" stroke-width="2" marker-end="url(#a)"/>
  <text x="433" y="255" text-anchor="middle" fill="#8a90a2" font-size="11">keys</text>
  <line x1="700" y1="134" x2="700" y2="176" stroke="#8a90a2" stroke-width="2" marker-end="url(#a)"/>
  <path d="M600,134 C600,160 300,150 230,176" fill="none" stroke="#8a90a2" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="370" width="820" height="44" rx="12" fill="#232733"/>
  <text x="450" y="398" text-anchor="middle" fill="#e8eaf0">rwatch.sh watchdog — reboots if the app's heartbeat counter stalls (~60 s awake); sleep never trips it</text>

  <!-- devices -->
  <g fill="#e8eaf0" font-size="13">
    <rect x="40" y="440" width="190" height="90" rx="12" fill="#1a1d25"/>
    <text x="135" y="468" text-anchor="middle" font-weight="600">Screen + touch</text>
    <text x="135" y="490" text-anchor="middle" fill="#8a90a2">fb0 720×1520</text>
    <text x="135" y="510" text-anchor="middle" fill="#8a90a2">double-tap wake</text>
    <rect x="250" y="440" width="190" height="90" rx="12" fill="#1a1d25"/>
    <text x="345" y="468" text-anchor="middle" font-weight="600">IR blaster</text>
    <text x="345" y="490" text-anchor="middle" fill="#8a90a2">ir2661 on SPI</text>
    <text x="345" y="510" text-anchor="middle" fill="#8a90a2">TV 00 7F · Fan D8 7E</text>
    <rect x="460" y="440" width="190" height="90" rx="12" fill="#1a1d25"/>
    <text x="555" y="468" text-anchor="middle" font-weight="600">Bluetooth</text>
    <text x="555" y="490" text-anchor="middle" fill="#8a90a2">WCNSS / Pronto</text>
    <text x="555" y="510" text-anchor="middle" fill="#8a90a2">HID → Android TV</text>
    <rect x="670" y="440" width="190" height="90" rx="12" fill="#1a1d25"/>
    <text x="765" y="468" text-anchor="middle" font-weight="600">Power</text>
    <text x="765" y="490" text-anchor="middle" fill="#8a90a2">suspend-to-RAM</text>
    <text x="765" y="510" text-anchor="middle" fill="#8a90a2">~10.8 mA avg</text>
  </g>
</svg>
